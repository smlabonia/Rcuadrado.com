name: CI

# Valida el HTML en cada push y PR. No despliega: GitHub Pages publica
# directamente desde main, este workflow solo avisa si algo se rompió.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  html:
    name: Validar HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run validate
